<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />

  <title>QuickPull · Admin Console</title>

  <!-- Apple SF-style Typography: Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ── Apple Design Tokens ─────────────────────────────────────────────── */
    :root {
      --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
      --font-mono:   "JetBrains Mono", "SF Mono", Menlo, Monaco, monospace;

      /* Apple Dark Translucent Palette */
      --canvas:       #06080f;
      --surface-glass: rgba(18, 23, 38, 0.72);
      --surface-subtle: rgba(255, 255, 255, 0.04);
      --surface-input: rgba(8, 12, 22, 0.65);
      --border:       rgba(255, 255, 255, 0.09);
      --border-specular: rgba(255, 255, 255, 0.22);
      --border-focus: #38bdf8;

      --text:         #f8fafc;
      --text-secondary: rgba(248, 250, 252, 0.72);
      --text-dim:     rgba(248, 250, 252, 0.44);

      --accent:       #0284c7;
      --accent-bright:#38bdf8;
      --accent-glow:  rgba(56, 189, 248, 0.35);

      --emerald:      #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.3);
      --rose:         #f43f5e;
      --rose-glass:   rgba(244, 63, 94, 0.14);
      --rose-border:  rgba(244, 63, 94, 0.35);

      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-system);
      background-color: var(--canvas);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
      selection-background-color: var(--accent);
      selection-color: #fff;
    }

    /* Ambient Apple Mesh Glows */
    .ambient-glow-1 {
      position: fixed;
      top: 15%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 580px;
      height: 480px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.16) 0%, rgba(99, 102, 241, 0.1) 40%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .ambient-glow-2 {
      position: fixed;
      bottom: 10%;
      right: 25%;
      width: 440px;
      height: 400px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, transparent 70%);
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Apple Frosted Glass Card ────────────────────────────────────────── */
    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      animation: cardAppear 0.5s var(--ease-spring);
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .login-card {
      background: var(--surface-glass);
      backdrop-filter: blur(32px) saturate(200%);
      -webkit-backdrop-filter: blur(32px) saturate(200%);
      border: 1px solid var(--border);
      border-top: 1px solid var(--border-specular);
      border-radius: 24px;
      padding: 2.75rem 2.25rem 2.25rem;
      box-shadow:
        0 24px 64px -12px rgba(0, 0, 0, 0.65),
        0 1px 1px 0 rgba(255, 255, 255, 0.1) inset,
        0 0 0 1px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    /* Specular light streak */
    .login-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      pointer-events: none;
    }

    /* ── Brand Section ───────────────────────────────────────────────────── */
    .brand {
      text-align: center;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-icon-wrapper {
      position: relative;
      margin-bottom: 1.125rem;
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(145deg, rgba(56, 189, 248, 0.18), rgba(14, 165, 233, 0.08));
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-top: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 12px 28px -6px rgba(14, 165, 233, 0.28),
        0 2px 4px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .brand-icon svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: var(--accent-bright);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 2px 6px rgba(56, 189, 248, 0.4));
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.2;
      color: var(--text);
    }

    .brand-subtitle-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      margin-top: 0.45rem;
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.22);
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent-bright);
    }

    .brand-subtitle-badge span.dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent-bright);
      box-shadow: 0 0 6px var(--accent-bright);
    }

    /* ── Error Box ───────────────────────────────────────────────────────── */
    .error-box {
      display: none;
      background: var(--rose-glass);
      border: 1px solid var(--rose-border);
      border-radius: 12px;
      color: #fda4af;
      font-size: 0.8125rem;
      font-weight: 500;
      padding: 0.875rem 1rem;
      margin-bottom: 1.35rem;
      line-height: 1.45;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(244, 63, 94, 0.12);
      animation: errorShake 0.35s var(--ease-spring);
    }

    @keyframes errorShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-5px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }

    /* ── Form Inputs ─────────────────────────────────────────────────────── */
    .form-group {
      margin-bottom: 1.25rem;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.45rem;
      transition: color 0.2s;
    }

    .form-group:focus-within .form-label {
      color: var(--accent-bright);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      width: 18px;
      height: 18px;
      stroke: var(--text-dim);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
      transition: stroke 0.2s;
    }

    .form-group:focus-within .input-icon {
      stroke: var(--accent-bright);
    }

    .form-input {
      width: 100%;
      background: var(--surface-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: var(--font-system);
      font-size: 0.875rem;
      padding: 0.75rem 1rem 0.75rem 2.65rem;
      outline: none;
      transition:
        border-color 0.2s var(--ease-spring),
        box-shadow 0.2s var(--ease-spring),
        background-color 0.2s var(--ease-spring);
    }

    .form-input::placeholder {
      color: rgba(248, 250, 252, 0.28);
    }

    .form-input:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    .form-input:focus {
      background: rgba(12, 17, 30, 0.85);
      border-color: var(--border-focus);
      box-shadow:
        0 0 0 3px rgba(56, 189, 248, 0.18),
        0 4px 12px rgba(0, 0, 0, 0.3);
    }

    /* ── Apple Primary Action Button ─────────────────────────────────────── */
    .btn-primary {
      position: relative;
      width: 100%;
      height: 44px;
      margin-top: 0.75rem;
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      font-family: var(--font-system);
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-top: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow:
        0 8px 24px -4px rgba(2, 132, 199, 0.45),
        0 2px 4px rgba(0, 0, 0, 0.3);
      transition:
        transform 0.12s var(--ease-spring),
        box-shadow 0.2s var(--ease-spring),
        filter 0.2s var(--ease-spring);
      user-select: none;
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.08);
      box-shadow:
        0 10px 28px -2px rgba(2, 132, 199, 0.55),
        0 2px 6px rgba(0, 0, 0, 0.4);
    }

    /* Kill latency: respond on pointer down */
    .btn-primary:active:not(:disabled) {
      transform: scale(0.975);
      filter: brightness(0.95);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    /* Apple-style circular spinner */
    .loading-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Footer Status ───────────────────────────────────────────────────── */
    .footer {
      margin-top: 1.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      color: var(--text-dim);
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .live-beacon {
      position: relative;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
    }

    .live-beacon::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 1px solid var(--emerald);
      opacity: 0.6;
      animation: ripple 2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    @keyframes ripple {
      0% { transform: scale(0.8); opacity: 0.9; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    /* ── Accessibility & Reduced Motion (Apple Design HIG) ──────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .login-container { animation: none; }
      .live-beacon::after { animation: none; }
    }

    @media (prefers-reduced-transparency: reduce) {
      .login-card {
        background: #0f1524;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
    }
  </style>
</head>

<body>
  <!-- Ambient background glow fields -->
  <div class="ambient-glow-1" aria-hidden="true"></div>
  <div class="ambient-glow-2" aria-hidden="true"></div>

  <div class="login-container">
    <div class="login-card">

      <!-- Brand Header -->
      <header class="brand">
        <div class="brand-icon-wrapper">
          <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
          </div>
        </div>
        <h1 class="brand-title">QuickPull</h1>
        <div class="brand-subtitle-badge">
          <span class="dot"></span>
          Admin Operations Console
        </div>
      </header>

      <!-- Error feedback container -->
      <div class="error-box" id="error-box" role="alert" aria-live="assertive"></div>

      <!-- Login Form -->
      <form id="login-form" autocomplete="off" novalidate>

        <div class="form-group">
          <label class="form-label" for="email">Admin Email</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24">
              <rect width="20" height="16" x="2" y="4" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
            <input
              id="email"
              class="form-input"
              type="email"
              name="email"
              placeholder="admin@quickpull.com"
              autocomplete="email"
              spellcheck="false"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Security Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              id="password"
              class="form-input"
              type="password"
              name="password"
              placeholder="••••••••••••"
              autocomplete="current-password"
              required
            />
          </div>
        </div>

        <button id="submit-btn" class="btn-primary" type="submit">
          Sign In to Console
        </button>

      </form>

      <!-- Status Footer -->
      <footer class="footer">
        <span class="live-beacon" aria-hidden="true"></span>
        <span>Authorized Personnel Only · 2h Protected Session</span>
      </footer>

    </div>
  </div>

  <!-- API and Auth Logic -->
  <script src="../api-config.js"></script>
  <script src="admin-api.js"></script>
  <script src="admin-login.js"></script>
</body>
</html>
